[workspace]
resolver = "2"

members = [
    "c2pa_c_ffi",
    "cli",
    "export_schema",
    "macros",
    "make_test_images",
    "s2patool",
    "sdk",
]

# members in this workspace can share this version setting
[workspace.package]
version = "0.58.0"

[workspace.dependencies]
# The SDK is published as `s2pa`; the `c2pa` key keeps in-tree `use c2pa::…`
# working via cargo's dependency rename.
c2pa = { package = "s2pa", path = "sdk", default-features = false }

[profile.release]
strip = true  # Automatically strip symbols from the binary.
opt-level = 3
lto = "thin"  # Link time optimization.
